apiVersion: v2
name: scrapeme
description: Selenium automation framework
type: application
version: 0.1.0
appVersion: "2.0.0"
dependencies:
  - name: postgresql
    version: 12.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.3.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: 26.0.0
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
