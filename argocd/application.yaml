apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapeme-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yonatan895/scrapeme.git
    targetRevision: HEAD
    path: charts/scrapeme
    helm:
      valueFiles:
        - ../../argocd/values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapeme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
