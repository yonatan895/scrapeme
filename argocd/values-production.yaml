# ArgoCD Production Overrides

image:
  tag: "2.0.0" # Pin version for production

mode: "deployment"

deployment:
  replicaCount: 2
  loopInterval: 300

config:
  env:
    # SITE_USERNAME: "prod-user" # Use secrets management (e.g. Vault/SealedSecrets) in real world
    # SITE_PASSWORD: "prod-password"
  sites: |
    sites:
      - name: production_example
        base_url: "https://example.com"
        wait_timeout_sec: 10
        page_load_timeout_sec: 20
        steps:
          - name: check_title
            wait_xpath: "//h1"
            fields:
              - name: title
                xpath: "//h1"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

monitoring:
  serviceMonitor:
    enabled: true

selenium-grid:
  enabled: true
  # Production Grid configuration
  replicas: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  maxUnavailable: 1

ingress:
  enabled: false # Enable when you have a domain
  # className: nginx
  # hosts:
  #   - host: scrapeme.example.com
